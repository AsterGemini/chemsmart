# Case 1 TS1 (ε-caprolactone ROP, C8–N29 forming).
# Atom numbers match ts-scout pathways/case1/TS1b.log.
# PLACEHOLDER: Chi sets these endpoint thresholds.
# The TS1b forward IRC end is C8–N29 = 1.574 Å (INT2). A product
# cutoff of < 1.5 Å is wrong and is not used.
# While endpoints is unset, check prints "endpoint criteria unset"
# and skips the endpoint bond verdict.
name: case1_ts1
project: zn5
charge: 0
multiplicity: 1
primary_bond: [8, 29]  # C8–N29
bonds:
  - [8, 29]    # C8–N29
  - [21, 2]    # Zn21–O2
  - [21, 29]   # Zn21–N29
  - [21, 1]    # Zn21–O1
  - [1, 8]     # O1–C8
endpoints: unset
# `chemsmart guess` drives this primary bond. Chi sets `to`.
# Forming example from the guess spec (~1.5 Å), not a fitted distance.
scan:
  bond: [8, 29]
  from: auto
  to: 1.5
  points: 12
