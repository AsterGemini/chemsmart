# Endpoint criteria from pass-2 spec: INT2 C113–O114 < 1.5 Å,
# product > 2.3 Å.
name: case3_ts2
project: zn5
charge: 0
multiplicity: 1
primary_bond: [113, 114]  # C113–O114
bonds:
  - [113, 114]  # C113–O114
  - [113, 115]  # C113–O115 carbonyl
  - [20, 113]   # N20–C113
  - [5, 114]    # Zn5–O114
endpoints:
  INT2:
    bonds:
      - atoms: [113, 114]
        op: "<"
        value: 1.5
  product:
    bonds:
      - atoms: [113, 114]
        op: ">"
        value: 2.3
# `chemsmart guess` drives this primary bond. Chi sets `to`.
# Breaking example from the guess spec (~2.4 Å), not a fitted distance.
scan:
  bond: [113, 114]
  from: auto
  to: 2.4
  points: 12
